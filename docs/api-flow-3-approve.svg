<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg"><title>API3 POST /invoices/{id}/approve happy path</title><desc>Request flow for invoice approval with GL entry generation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:sans-serif;fill:#222}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#555}</style><text font-size="15" font-weight="500" font-family="sans-serif" fill="#222" x="340" y="28" text-anchor="middle">API3 - POST /invoices/{id}/approve</text><text font-size="12" font-family="sans-serif" fill="#666" x="340" y="46" text-anchor="middle">Happy path: approval + GL entry generation</text><rect x="20" y="70" width="110" height="56" rx="8" fill="#f1efe8" stroke="#888" stroke-width="0.5"/><text class="th" x="75" y="92" text-anchor="middle" dominant-baseline="central">Client</text><text class="ts" x="75" y="110" text-anchor="middle" dominant-baseline="central">approver / cfo</text><line x1="130" y1="98" x2="168" y2="98" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#0F6E56" x="149" y="86" text-anchor="middle">POST /approve</text><text font-size="11" font-family="sans-serif" fill="#888" x="149" y="116" text-anchor="middle">If-Match: v + idempotency</text><rect x="170" y="70" width="120" height="116" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="230" y="93" text-anchor="middle" dominant-baseline="central">L7 gateway</text><text class="ts" x="230" y="111" text-anchor="middle" dominant-baseline="central">SSL terminate</text><text class="ts" x="230" y="127" text-anchor="middle" dominant-baseline="central">JWT sig check</text><text class="ts" x="230" y="143" text-anchor="middle" dominant-baseline="central">Idempotency fmt</text><text class="ts" x="230" y="159" text-anchor="middle" dominant-baseline="central">Rate limit</text><text class="ts" x="230" y="175" text-anchor="middle" dominant-baseline="central">Inject trace ID</text><line x1="290" y1="128" x2="328" y2="128" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="60" width="155" height="236" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/><text class="th" x="407" y="83" text-anchor="middle" dominant-baseline="central">AR application</text><text class="ts" x="407" y="101" text-anchor="middle" dominant-baseline="central">Re-validate JWT</text><text class="ts" x="407" y="117" text-anchor="middle" dominant-baseline="central">RBAC: approver / cfo</text><text class="ts" x="407" y="133" text-anchor="middle" dominant-baseline="central">Idempotency check</text><text class="ts" x="407" y="149" text-anchor="middle" dominant-baseline="central">If-Match version check</text><text class="ts" x="407" y="165" text-anchor="middle" dominant-baseline="central">SOX: creator != approver</text><text class="ts" x="407" y="181" text-anchor="middle" dominant-baseline="central">Period close check</text><text class="ts" x="407" y="197" text-anchor="middle" dominant-baseline="central">GL entry generation</text><text class="ts" x="407" y="213" text-anchor="middle" dominant-baseline="central">Repeatable Read txn</text><text class="ts" x="407" y="229" text-anchor="middle" dominant-baseline="central">Outbox event (delivery)</text><text class="ts" x="407" y="269" text-anchor="middle" dominant-baseline="central">200 APPROVED v:2</text><rect x="520" y="60" width="140" height="236" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="590" y="83" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="590" y="107" text-anchor="middle" dominant-baseline="central">invoice (APPROVED)</text><text class="ts" x="590" y="123" text-anchor="middle" dominant-baseline="central">version: 1 to 2</text><text class="ts" x="590" y="143" text-anchor="middle" dominant-baseline="central">journal_entry</text><text class="ts" x="590" y="163" text-anchor="middle" dominant-baseline="central">DR AR  174,000</text><text class="ts" x="590" y="179" text-anchor="middle" dominant-baseline="central">CR Revenue 150,000</text><text class="ts" x="590" y="195" text-anchor="middle" dominant-baseline="central">CR Tax Pay  24,000</text><text class="ts" x="590" y="215" text-anchor="middle" dominant-baseline="central">idempotency_key</text><text class="ts" x="590" y="231" text-anchor="middle" dominant-baseline="central">audit_log (trigger)</text><text class="ts" x="590" y="247" text-anchor="middle" dominant-baseline="central">delivery_outbox</text><text class="ts" x="590" y="267" text-anchor="middle" dominant-baseline="central">All in one ACID txn</text><line x1="485" y1="148" x2="518" y2="148" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="518" y1="170" x2="487" y2="170" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="328" y1="170" x2="292" y2="170" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="168" y1="170" x2="132" y2="170" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#888" x="230" y="188" text-anchor="middle">200 {status:APPROVED, v:2, journal_entry_id}</text><rect x="20" y="320" width="640" height="100" rx="8" fill="#f5f5f2" stroke="#ccc" stroke-width="0.5"/><text class="th" x="30" y="340" dominant-baseline="central">Key error cases</text><text class="ts" x="30" y="358" dominant-baseline="central">409 VERSION_CONFLICT: If-Match does not match current version (concurrent modification)</text><text class="ts" x="30" y="374" dominant-baseline="central">422 SOX_VIOLATION: creator_id == approver_id (same person cannot approve own invoice)</text><text class="ts" x="30" y="390" dominant-baseline="central">423 PERIOD_CLOSED: invoice_date falls in a CLOSED or LOCKED period</text><text class="ts" x="30" y="406" dominant-baseline="central">422 INVALID_STATUS: invoice not in DRAFT state</text></svg>