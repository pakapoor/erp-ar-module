<rect x="310" y="409" width="10" height="10" rx="2" fill="#eeedfe" stroke="#534AB7" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444444" x="326" y="419">Gateway</text>
<rect x="390" y="409" width="10" height="10" rx="2" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444444" x="406" y="419">Application</text>
<rect x="475" y="409" width="10" height="10" rx="2" fill="#e6f1fb" stroke="#185FA5" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444444" x="491" y="419">Storage</text>
<rect x="545" y="409" width="10" height="10" rx="2" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444444" x="561" y="419">Auth</text>

<!-- Arrow markers -->
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#ba7517" stroke-width="1.5" stroke-linecap="round"/>
</marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
