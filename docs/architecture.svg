<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="258" text-anchor="middle">JWKS public keys</text>

<!-- Dashed arrows to Auth -->
<line x1="215" y1="178" x2="215" y2="218" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
<line x1="360" y1="270" x2="280" y2="258" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ba7517" x="295" y="285" text-anchor="middle">kid lookup (both layers)</text>

