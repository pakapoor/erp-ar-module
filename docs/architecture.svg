<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ERP AR Module Architecture</title>
<desc>System architecture showing client, Envoy gateway, FastAPI application, PostgreSQL, and SQS delivery pipeline</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
  .title { font-size: 15px; font-weight: 600; }
  .label { font-size: 12px; font-weight: 500; }
  .detail { font-size: 11px; fill: #555; }
  .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arr); }
  .arrow-async { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 5,3; marker-end: url(#arr-gray); }
</style>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="title" x="360" y="28" text-anchor="middle">ERP AR Module Ñ System Architecture</text>

<!-- CLIENT -->
<rect x="20" y="60" width="90" height="60" rx="8" fill="#f5f4f0" stroke="#aaa" stroke-width="1"/>
<text class="label" x="65" y="86" text-anchor="middle">Client</text>
<text class="detail" x="65" y="102" text-anchor="middle">Web / mobile</text>
<text class="detail" x="65" y="116" text-anchor="middle">CFO / AR team</text>

<!-- Arrow: Client ? Envoy -->
<line x1="110" y1="90" x2="148" y2="90" class="arrow"/>
<text class="detail" x="129" y="83" text-anchor="middle" fill="#534AB7">HTTPS + JWT</text>

<!-- ENVOY GATEWAY -->
<rect x="150" y="48" width="130" height="120" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="1"/>
<text class="label" x="215" y="72" text-anchor="middle" fill="#534AB7">Envoy L7 Gateway</text>
<text class="detail" x="215" y="90" text-anchor="middle">JWT validation</text>
<text class="detail" x="215" y="106" text-anchor="middle">Rate limiting</text>
<text class="detail" x="215" y="122" text-anchor="middle">Trace ID injection</text>
<text class="detail" x="215" y="138" text-anchor="middle">Path normalization</text>
<text class="detail" x="215" y="154" text-anchor="middle">No app host access</text>

<!-- Arrow: Envoy ? App -->
<line x1="280" y1="108" x2="318" y2="108" class="arrow"/>

<!-- AR APPLICATION -->
<rect x="320" y="40" width="160" height="220" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text class="label" x="400" y="64" text-anchor="middle" fill="#0f6e56">AR Application</text>
<text class="detail" x="400" y="80" text-anchor="middle">(FastAPI Ñ stateless)</text>
<text class="detail" x="400" y="102" text-anchor="middle">Zero Trust JWT re-validation</text>
<text class="detail" x="400" y="118" text-anchor="middle">Tenant / entity / RBAC</text>
<text class="detail" x="400" y="134" text-anchor="middle">Idempotency (PostgreSQL)</text>
<text class="detail" x="400" y="150" text-anchor="middle">Invoice lifecycle</text>
<text class="detail" x="400" y="166" text-anchor="middle">Payment FIFO allocation</text>
<text class="detail" x="400" y="182" text-anchor="middle">GL journal generation</text>
<text class="detail" x="400" y="198" text-anchor="middle">FX gain / loss</text>
<text class="detail" x="400" y="214" text-anchor="middle">Period close enforcement</text>
<text class="detail" x="400" y="230" text-anchor="middle">Transactional outbox</text>
<text class="detail" x="400" y="248" text-anchor="middle">Scales horizontally</text>

<!-- Arrow: App ? PostgreSQL -->
<line x1="480" y1="140" x2="518" y2="140" class="arrow"/>
<text class="detail" x="499" y="133" text-anchor="middle" fill="#185FA5">ACID</text>

<!-- POSTGRESQL -->
<rect x="520" y="40" width="150" height="220" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="1"/>
<text class="label" x="595" y="64" text-anchor="middle" fill="#185FA5">PostgreSQL 16</text>
<text class="detail" x="595" y="86" text-anchor="middle">invoice + line_item</text>
<text class="detail" x="595" y="102" text-anchor="middle">payment + allocation</text>
<text class="detail" x="595" y="118" text-anchor="middle">journal_entry + lines</text>
<text class="detail" x="595" y="134" text-anchor="middle">gl_account</text>
<text class="detail" x="595" y="150" text-anchor="middle">audit_log (immutable)</text>
<text class="detail" x="595" y="166" text-anchor="middle">idempotency_key</text>
<text class="detail" x="595" y="182" text-anchor="middle">delivery_outbox</text>
<text class="detail" x="595" y="198" text-anchor="middle">exchange_rate</text>
<text class="detail" x="595" y="218" text-anchor="middle">ar_aging (MV)</text>
<text class="detail" x="595" y="238" text-anchor="middle">RLS on all tables</text>
<text class="detail" x="595" y="254" text-anchor="middle">pg_cron (MV refresh)</text>

<!-- AUTH SERVER -->
<rect x="150" y="210" width="130" height="50" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
<text class="label" x="215" y="232" text-anchor="middle" fill="#ba7517">Auth Server</text>
<text class="detail" x="215" y="248" text-anchor="middle">JWKS public keys</text>

<!-- Arrows: Envoy + App ? Auth -->
<line x1="215" y1="168" x2="215" y2="208" class="arrow-async"/>
<line x1="370" y1="260" x2="280" y2="248" class="arrow-async"/>
<text class="detail" x="260" y="272" text-anchor="middle" fill="#ba7517">kid lookup (both layers)</text>

<!-- DELIVERY PIPELINE -->
<rect x="150" y="310" width="520" height="90" rx="8" fill="#f9f9f7" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3"/>
<text class="label" x="410" y="332" text-anchor="middle" fill="#888">Async Delivery Pipeline</text>

<rect x="165" y="342" width="110" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text class="detail" x="220" y="360" text-anchor="middle" font-weight="500">Publisher</text>
<text class="detail" x="220" y="376" text-anchor="middle">polls outbox</text>

<line x1="275" y1="364" x2="303" y2="364" class="arrow-async"/>

<rect x="305" y="342" width="90" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text class="detail" x="350" y="360" text-anchor="middle" font-weight="500">SQS</text>
<text class="detail" x="350" y="376" text-anchor="middle">+ DLQ</text>

<line x1="395" y1="364" x2="423" y2="364" class="arrow-async"/>

<rect x="425" y="342" width="90" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text class="detail" x="470" y="360" text-anchor="middle" font-weight="500">Consumer</text>
<text class="detail" x="470" y="376" text-anchor="middle">idempotent</text>

<line x1="515" y1="364" x2="543" y2="364" class="arrow-async"/>

<rect x="545" y="342" width="110" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text class="detail" x="600" y="360" text-anchor="middle" font-weight="500">Adapter</text>
<text class="detail" x="600" y="376" text-anchor="middle">Email / EDI (V2)</text>

<!-- Arrow: App ? Pipeline -->
<line x1="400" y1="260" x2="400" y2="308" class="arrow-async"/>
<text class="detail" x="415" y="290" text-anchor="start" fill="#888">after commit</text>

<!-- Legend -->
<line x1="20" y1="395" x2="50" y2="395" stroke="#666" stroke-width="1.5"/>
<text class="detail" x="56" y="399" dominant-baseline="central">Synchronous</text>
<line x1="150" y1="395" x2="180" y2="395" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/>
<text class="detail" x="186" y="399" dominant-baseline="central">Async / background</text>
<rect x="300" y="390" width="10" height="10" rx="2" fill="#eeedfe" stroke="#534AB7" stroke-width="1"/>
<text class="detail" x="316" y="399" dominant-baseline="central">Gateway</text>
<rect x="380" y="390" width="10" height="10" rx="2" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text class="detail" x="396" y="399" dominant-baseline="central">Application</text>
<rect x="460" y="390" width="10" height="10" rx="2" fill="#e6f1fb" stroke="#185FA5" stroke-width="1"/>
<text class="detail" x="476" y="399" dominant-baseline="central">Storage</text>
<rect x="530" y="390" width="10" height="10" rx="2" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
<text class="detail" x="546" y="399" dominant-baseline="central">Auth</text>

</svg>