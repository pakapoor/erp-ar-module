<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#555555" x="402" y="78" text-anchor="middle">(FastAPI - stateless)</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="98" text-anchor="middle">Zero Trust JWT re-validation</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="114" text-anchor="middle">Tenant / entity / RBAC</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="130" text-anchor="middle">Idempotency (PostgreSQL)</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="146" text-anchor="middle">Invoice lifecycle</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="162" text-anchor="middle">Payment FIFO allocation</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="178" text-anchor="middle">GL journal generation</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="194" text-anchor="middle">FX gain / loss</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="210" text-anchor="middle">Period close enforcement</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="402" y="226" text-anchor="middle">Transactional outbox</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="402" y="258" text-anchor="middle">scales horizontally</text>

<!-- Arrow App to PostgreSQL -->
<line x1="485" y1="155" x2="523" y2="155" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
