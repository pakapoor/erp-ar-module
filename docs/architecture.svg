<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="84" text-anchor="middle">invoice + line_item</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="100" text-anchor="middle">payment + allocation</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="116" text-anchor="middle">journal_entry + lines</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="132" text-anchor="middle">gl_account</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="148" text-anchor="middle">audit_log (immutable)</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="164" text-anchor="middle">idempotency_key</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="180" text-anchor="middle">delivery_outbox</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="196" text-anchor="middle">exchange_rate</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="212" text-anchor="middle">ar_aging (MV)</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="228" text-anchor="middle">RLS on all tables</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333" x="605" y="244" text-anchor="middle">pg_cron (MV + FX)</text>

<!-- AUTH SERVER -->
<rect x="150" y="220" width="130" height="50" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1.5"/>
