<?xml version="1.0" encoding="UTF-8"?>
<svg width="740" height="440" viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg">
<rect width="740" height="440" fill="#ffffff"/>

<!-- Title -->
<text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" x="370" y="28" text-anchor="middle">ERP AR Module - System Architecture</text>

<!-- CLIENT -->
<rect x="20" y="60" width="90" height="60" rx="8" fill="#f5f4f0" stroke="#aaaaaa" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#222222" x="65" y="84" text-anchor="middle">Client</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555" x="65" y="100" text-anchor="middle">Web / mobile</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555" x="65" y="114" text-anchor="middle">CFO / AR team</text>

<!-- Arrow Client to Envoy -->
<line x1="110" y1="90" x2="148" y2="90" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#534AB7" x="129" y="83" text-anchor="middle">HTTPS + JWT</text>

<!-- ENVOY GATEWAY -->
<rect x="150" y="48" width="130" height="130" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#534AB7" x="215" y="70" text-anchor="middle">Envoy L7 Gateway</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="88" text-anchor="middle">JWT validation</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="104" text-anchor="middle">Rate limiting</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="120" text-anchor="middle">Trace ID injection</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="136" text-anchor="middle">Path normalization</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="152" text-anchor="middle">No app host access</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#444444" x="215" y="168" text-anchor="middle">Round-robin LB</text>

<!-- Arrow Envoy to App -->
<line x1="280" y1="113" x2="318" y2="113" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- AR APPLICATION -->
<rect x="320" y="40" width="165" height="230" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
