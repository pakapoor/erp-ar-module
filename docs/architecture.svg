<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="340" y="386" text-anchor="middle">Standard queue</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="340" y="398" text-anchor="middle">+ DLQ</text>

<line x1="385" y1="377" x2="413" y2="377" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

<!-- Consumer -->
<rect x="415" y="350" width="90" height="54" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#333333" x="460" y="370" text-anchor="middle">Consumer</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="460" y="386" text-anchor="middle">idempotent</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="460" y="398" text-anchor="middle">event ID key</text>

<line x1="505" y1="377" x2="533" y2="377" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

<!-- Adapter -->
<rect x="535" y="350" width="135" height="54" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#333333" x="602" y="370" text-anchor="middle">Adapter</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="602" y="386" text-anchor="middle">Delivery stub (V1)</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="602" y="398" text-anchor="middle">Email/EDI/IRP (V2)</text>

<!-- Arrow App to Pipeline -->
<line x1="402" y1="270" x2="402" y2="318" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888888" x="418" y="298" text-anchor="start">after commit</text>

<!-- LEGEND -->
<line x1="20" y1="415" x2="50" y2="415" stroke="#666666" stroke-width="1.5"/>
