<text font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#888888" x="417" y="340" text-anchor="middle">Async Delivery Pipeline</text>

<!-- Publisher -->
<rect x="165" y="350" width="100" height="54" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#333333" x="215" y="370" text-anchor="middle">Publisher</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="215" y="386" text-anchor="middle">polls outbox</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" x="215" y="398" text-anchor="middle">after commit</text>

<line x1="265" y1="377" x2="293" y2="377" stroke="#999999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

<!-- SQS -->
<rect x="295" y="350" width="90" height="54" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
