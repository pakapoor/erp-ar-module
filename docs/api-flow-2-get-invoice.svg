<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg"><title>API2 GET /invoices/{id} happy path</title><desc>Request flow for invoice retrieval with payment history</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:sans-serif;fill:#222}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#555}</style><text font-size="15" font-weight="500" font-family="sans-serif" fill="#222" x="340" y="28" text-anchor="middle">API2 - GET /invoices/{id}</text><text font-size="12" font-family="sans-serif" fill="#666" x="340" y="46" text-anchor="middle">Happy path: invoice retrieval with full history</text><rect x="20" y="70" width="110" height="44" rx="8" fill="#f1efe8" stroke="#888" stroke-width="0.5"/><text class="th" x="75" y="92" text-anchor="middle" dominant-baseline="central">Client</text><line x1="130" y1="92" x2="168" y2="92" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#993C1D" x="149" y="82" text-anchor="middle">GET /invoices/{id}</text><text font-size="11" font-family="sans-serif" fill="#888" x="149" y="108" text-anchor="middle">+ JWT</text><rect x="170" y="70" width="120" height="96" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="230" y="93" text-anchor="middle" dominant-baseline="central">L7 gateway</text><text class="ts" x="230" y="111" text-anchor="middle" dominant-baseline="central">SSL terminate</text><text class="ts" x="230" y="127" text-anchor="middle" dominant-baseline="central">JWT sig check</text><text class="ts" x="230" y="143" text-anchor="middle" dominant-baseline="central">Rate limit</text><text class="ts" x="230" y="159" text-anchor="middle" dominant-baseline="central">Inject trace ID</text><text font-size="11" font-family="sans-serif" fill="#888" x="230" y="178" text-anchor="middle">No idempotency (GET)</text><line x1="290" y1="118" x2="328" y2="118" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="60" width="150" height="176" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/><text class="th" x="405" y="83" text-anchor="middle" dominant-baseline="central">AR application</text><text class="ts" x="405" y="101" text-anchor="middle" dominant-baseline="central">Re-validate JWT</text><text class="ts" x="405" y="117" text-anchor="middle" dominant-baseline="central">Any authenticated user</text><text class="ts" x="405" y="133" text-anchor="middle" dominant-baseline="central">No idempotency needed</text><text class="ts" x="405" y="149" text-anchor="middle" dominant-baseline="central">Live JOIN (no cache)</text><text class="ts" x="405" y="165" text-anchor="middle" dominant-baseline="central">No audit (read only)</text><text class="ts" x="405" y="181" text-anchor="middle" dominant-baseline="central">ETag = version header</text><text class="ts" x="405" y="217" text-anchor="middle" dominant-baseline="central">200 + ETag: v</text><rect x="520" y="60" width="140" height="176" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="590" y="83" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="590" y="107" text-anchor="middle" dominant-baseline="central">invoice (header)</text><text class="ts" x="590" y="123" text-anchor="middle" dominant-baseline="central">invoice_line_item</text><text class="ts" x="590" y="139" text-anchor="middle" dominant-baseline="central">payment_allocation</text><text class="ts" x="590" y="155" text-anchor="middle" dominant-baseline="central">payment</text><text class="ts" x="590" y="171" text-anchor="middle" dominant-baseline="central">credit_memo</text><text class="ts" x="590" y="187" text-anchor="middle" dominant-baseline="central">audit_log (history)</text><text class="ts" x="590" y="207" text-anchor="middle" dominant-baseline="central">Live JOIN &lt;100ms</text><line x1="480" y1="148" x2="518" y2="148" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="518" y1="168" x2="482" y2="168" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="328" y1="168" x2="292" y2="168" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="168" y1="168" x2="132" y2="168" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#888" x="230" y="190" text-anchor="middle">200 + ETag: version</text><rect x="20" y="280" width="305" height="100" rx="8" fill="#f5f5f2" stroke="#ccc" stroke-width="0.5"/><text class="th" x="30" y="300" dominant-baseline="central">Why live JOIN - no cache?</text><text class="ts" x="30" y="318" dominant-baseline="central">NFR2: &lt;100ms p99 -- indexes achieve this</text><text class="ts" x="30" y="334" dominant-baseline="central">NFR1: staleness not acceptable for invoice detail</text><text class="ts" x="30" y="350" dominant-baseline="central">CFO approves based on what they see</text><text class="ts" x="30" y="368" dominant-baseline="central">No Redis -- consistent with no-Redis decision</text><rect x="340" y="280" width="320" height="100" rx="8" fill="#f5f5f2" stroke="#ccc" stroke-width="0.5"/><text class="th" x="350" y="300" dominant-baseline="central">ETag usage</text><text class="ts" x="350" y="318" dominant-baseline="central">ETag: 2 returned in GET response</text><text class="ts" x="350" y="334" dominant-baseline="central">If-Match: 2 required on next write (approve)</text><text class="ts" x="350" y="350" dominant-baseline="central">Prevents ABA problem -- optimistic locking</text><text class="ts" x="350" y="368" dominant-baseline="central">Version mismatch: 409 VERSION_CONFLICT</text></svg>