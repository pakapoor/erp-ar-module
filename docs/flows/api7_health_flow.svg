<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img">
  <title>API7 health and reconciliation flow</title>
  <desc>Unauthenticated operational health endpoint checks PostgreSQL, aging freshness, and entity-level AR-to-GL reconciliation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185fa5"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .title { font-size: 22px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52606d; }
      .heading { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; }
      .box { stroke-width: 1.5; rx: 12; }
      .arrow { fill: none; stroke: #185fa5; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="510" fill="#fff"/>
  <text x="480" y="34" text-anchor="middle" class="title">API7 — GET /health</text>
  <text x="480" y="58" text-anchor="middle" class="subtitle">Operational readiness plus financial-control signal; no authentication required</text>

  <rect x="30" y="105" width="180" height="90" class="box" fill="#f1efe8" stroke="#5f5e5a"/>
  <text x="120" y="135" text-anchor="middle" class="heading">Health Consumer</text>
  <text x="120" y="159" text-anchor="middle" class="body">Docker / load balancer</text>
  <text x="120" y="180" text-anchor="middle" class="body">Monitoring system</text>

  <rect x="270" y="95" width="210" height="110" class="box" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="375" y="126" text-anchor="middle" class="heading">AR Application</text>
  <text x="375" y="151" text-anchor="middle" class="body">Run checks independently</text>
  <text x="375" y="172" text-anchor="middle" class="body">Aggregate overall status</text>
  <text x="375" y="193" text-anchor="middle" class="body">Include version + timestamp</text>
  <path d="M210 150 H268" class="arrow"/>

  <rect x="555" y="82" width="180" height="78" class="box" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="645" y="111" text-anchor="middle" class="heading">1. Connectivity</text>
  <text x="645" y="137" text-anchor="middle" class="body">PostgreSQL SELECT 1</text>

  <rect x="555" y="181" width="180" height="88" class="box" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="645" y="210" text-anchor="middle" class="heading">2. Aging MV</text>
  <text x="645" y="235" text-anchor="middle" class="body">MAX(as_of) age</text>
  <text x="645" y="255" text-anchor="middle" class="body">stale when &gt; 10 minutes</text>

  <rect x="555" y="290" width="375" height="120" class="box" fill="#fff7e6" stroke="#b7791f"/>
  <text x="742" y="320" text-anchor="middle" class="heading">3. Entity-level AR Reconciliation</text>
  <text x="742" y="346" text-anchor="middle" class="body">Posted invoice base balances (subledger)</text>
  <text x="742" y="369" text-anchor="middle" class="body">versus GL account 1200 debit − credit</text>
  <text x="742" y="392" text-anchor="middle" class="body">Mismatch threshold: ₹0.01 per tenant + entity</text>

  <path d="M480 130 H553" class="arrow"/>
  <path d="M480 150 H520 V225 H553" class="arrow"/>
  <path d="M480 170 H510 V350 H553" class="arrow"/>

  <rect x="65" y="315" width="385" height="125" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="257" y="345" text-anchor="middle" class="heading">Response decision</text>
  <text x="257" y="371" text-anchor="middle" class="body">200 healthy: DB reachable, MV fresh, books matched</text>
  <text x="257" y="394" text-anchor="middle" class="body">503 degraded: MV older than 10 minutes</text>
  <text x="257" y="417" text-anchor="middle" class="body">503 unhealthy: DB failure or AR/GL mismatch</text>
  <path d="M555 390 H500 V377 H452" class="arrow"/>

  <text x="480" y="481" text-anchor="middle" class="subtitle">The health endpoint detects mismatches; it never repairs or mutates financial data.</text>
</svg>
