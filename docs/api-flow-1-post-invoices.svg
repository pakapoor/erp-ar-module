<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg"><title>API1 POST /invoices happy path</title><desc>Request flow for invoice creation from client through gateway to database</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:sans-serif;fill:#222}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#555}.box{fill:#f5f5f2;stroke:#aaa;stroke-width:0.5}</style><text font-size="15" font-weight="500" font-family="sans-serif" fill="#222" x="340" y="28" text-anchor="middle">API1 - POST /invoices</text><text font-size="12" font-family="sans-serif" fill="#666" x="340" y="46" text-anchor="middle">Happy path: invoice creation</text><rect x="20" y="70" width="110" height="56" rx="8" fill="#f1efe8" stroke="#888" stroke-width="0.5"/><text class="th" x="75" y="93" text-anchor="middle" dominant-baseline="central">Client</text><text class="ts" x="75" y="111" text-anchor="middle" dominant-baseline="central">AR team / CFO</text><line x1="130" y1="98" x2="168" y2="98" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#534AB7" x="149" y="88" text-anchor="middle">POST /invoices</text><text font-size="11" font-family="sans-serif" fill="#888" x="149" y="114" text-anchor="middle">JWT + idempotency key</text><rect x="170" y="70" width="120" height="116" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="230" y="93" text-anchor="middle" dominant-baseline="central">L7 gateway</text><text class="ts" x="230" y="111" text-anchor="middle" dominant-baseline="central">SSL terminate</text><text class="ts" x="230" y="127" text-anchor="middle" dominant-baseline="central">JWT sig check</text><text class="ts" x="230" y="143" text-anchor="middle" dominant-baseline="central">Idempotency fmt</text><text class="ts" x="230" y="159" text-anchor="middle" dominant-baseline="central">Rate limit</text><text class="ts" x="230" y="175" text-anchor="middle" dominant-baseline="central">Inject trace ID</text><line x1="290" y1="128" x2="328" y2="128" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="60" width="150" height="196" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/><text class="th" x="405" y="83" text-anchor="middle" dominant-baseline="central">AR application</text><text class="ts" x="405" y="101" text-anchor="middle" dominant-baseline="central">Re-validate JWT</text><text class="ts" x="405" y="117" text-anchor="middle" dominant-baseline="central">RBAC: invoice_creator</text><text class="ts" x="405" y="133" text-anchor="middle" dominant-baseline="central">Idempotency DB check</text><text class="ts" x="405" y="149" text-anchor="middle" dominant-baseline="central">Credit limit check</text><text class="ts" x="405" y="165" text-anchor="middle" dominant-baseline="central">Calc totals server-side</text><text class="ts" x="405" y="181" text-anchor="middle" dominant-baseline="central">Calc due_date</text><text class="ts" x="405" y="197" text-anchor="middle" dominant-baseline="central">ACID transaction</text><text class="ts" x="405" y="213" text-anchor="middle" dominant-baseline="central">Audit trigger (DB)</text><text class="ts" x="405" y="239" text-anchor="middle" dominant-baseline="central">201 DRAFT v:1</text><rect x="330" y="280" width="150" height="44" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/><text class="th" x="405" y="298" text-anchor="middle" dominant-baseline="central">Auth server</text><text class="ts" x="405" y="314" text-anchor="middle" dominant-baseline="central">JWKS zero trust</text><line x1="405" y1="256" x2="405" y2="278" stroke="#BA7517" stroke-width="0.8" stroke-dasharray="4,2" marker-end="url(#arrow)"/><line x1="480" y1="128" x2="518" y2="128" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#185FA5" x="499" y="118" text-anchor="middle">ACID write</text><rect x="520" y="60" width="140" height="196" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/><text class="th" x="590" y="83" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="590" y="107" text-anchor="middle" dominant-baseline="central">invoice (DRAFT)</text><text class="ts" x="590" y="123" text-anchor="middle" dominant-baseline="central">invoice_line_item x N</text><text class="ts" x="590" y="139" text-anchor="middle" dominant-baseline="central">idempotency_key</text><text class="ts" x="590" y="155" text-anchor="middle" dominant-baseline="central">audit_log (trigger)</text><text class="ts" x="590" y="175" text-anchor="middle" dominant-baseline="central">RLS enforced</text><text class="ts" x="590" y="191" text-anchor="middle" dominant-baseline="central">all in one txn</text><line x1="518" y1="148" x2="482" y2="148" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="328" y1="148" x2="292" y2="148" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><line x1="168" y1="148" x2="132" y2="148" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text font-size="11" font-family="sans-serif" fill="#888" x="230" y="164" text-anchor="middle">201 {id, status:DRAFT, version:1}</text><rect x="20" y="360" width="640" height="60" rx="8" fill="#f5f5f2" stroke="#ccc" stroke-width="0.5"/><text class="th" x="30" y="382" dominant-baseline="central">Idempotency replay</text><text class="ts" x="30" y="400" dominant-baseline="central">Same key + same hash + COMPLETED: return cached 201 (no DB write)</text><text class="ts" x="30" y="416" dominant-baseline="central">Same key + PROCESSING: 409 | Same key + different hash: 409 IDEMPOTENCY_KEY_REUSED</text><rect x="20" y="436" width="640" height="60" rx="8" fill="#f5f5f2" stroke="#ccc" stroke-width="0.5"/><text class="th" x="30" y="458" dominant-baseline="central">Server-side calculations (never trust client totals)</text><text class="ts" x="30" y="476" dominant-baseline="central">subtotal = sum(qty x unit_price per line) | tax = sum(subtotal x tax_rate) | total = subtotal + tax</text><text class="ts" x="30" y="492" dominant-baseline="central">due_date = invoice_date + payment_terms_days | credit_limit checked before insert</text></svg>