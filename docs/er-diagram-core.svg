<svg width="100%" viewBox="0 0 680 900" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Core entities ER diagram — ERP AR Module</title>
<desc>Entity relationship diagram showing 7 core tables: Tenant, Entity, Customer, Invoice, Payment, Journal Entry, GL Account</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: sans-serif; fill: #3d3d3a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; }
.purple-fill { fill: #EEEDFE; stroke: #534AB7; }
.teal-fill { fill: #E1F5EE; stroke: #0F6E56; }
.coral-fill { fill: #FAECE7; stroke: #993C1D; }
.amber-fill { fill: #FAEEDA; stroke: #BA7517; }
.blue-fill { fill: #E6F1FB; stroke: #185FA5; }
.purple-text { fill: #3C3489; }
.teal-text { fill: #085041; }
.coral-text { fill: #712B13; }
.amber-text { fill: #633806; }
.blue-text { fill: #0C447C; }
</style>
</defs>

<!-- TENANT -->
<rect x="240" y="20" width="200" height="100" rx="8" stroke-width="0.5" class="purple-fill"/>
<text class="th purple-text" x="340" y="48" text-anchor="middle" dominant-baseline="central">Tenant</text>
<text class="ts purple-text" x="340" y="68" text-anchor="middle" dominant-baseline="central">id, name</text>
<text class="ts purple-text" x="340" y="84" text-anchor="middle" dominant-baseline="central">base_currency</text>
<text class="ts purple-text" x="340" y="100" text-anchor="middle" dominant-baseline="central">created_at</text>

<!-- Tenant to Entity -->
<line x1="340" y1="120" x2="340" y2="155" stroke="#534AB7" stroke-width="0.5" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="350" y="140" dominant-baseline="central">1:N</text>

<!-- ENTITY -->
<rect x="240" y="155" width="200" height="110" rx="8" stroke-width="0.5" class="purple-fill"/>
<text class="th purple-text" x="340" y="183" text-anchor="middle" dominant-baseline="central">Entity</text>
<text class="ts purple-text" x="340" y="203" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts purple-text" x="340" y="219" text-anchor="middle" dominant-baseline="central">parent_entity_id FK</text>
<text class="ts purple-text" x="340" y="235" text-anchor="middle" dominant-baseline="central">name, currency</text>

<!-- Entity self-referential -->
<path d="M440 210 L480 210 L480 175 L440 175" stroke="#534AB7" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="488" y="193" dominant-baseline="central">self</text>

<!-- Entity to Customer -->
<path d="M240 210 L120 210 L120 370 L160 370" stroke="#534AB7" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="125" y="295" dominant-baseline="central">1:N</text>

<!-- Entity to Invoice -->
<path d="M340 265 L340 300" stroke="#534AB7" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="285" dominant-baseline="central">1:N</text>

<!-- Entity to GL Account -->
<path d="M440 210 L560 210 L560 370 L520 370" stroke="#0F6E56" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="565" y="295" dominant-baseline="central">1:N</text>

<!-- CUSTOMER -->
<rect x="20" y="300" width="180" height="120" rx="8" stroke-width="0.5" class="teal-fill"/>
<text class="th teal-text" x="110" y="328" text-anchor="middle" dominant-baseline="central">Customer</text>
<text class="ts teal-text" x="110" y="348" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts teal-text" x="110" y="364" text-anchor="middle" dominant-baseline="central">entity_id FK</text>
<text class="ts teal-text" x="110" y="380" text-anchor="middle" dominant-baseline="central">name, tax_id</text>
<text class="ts teal-text" x="110" y="396" text-anchor="middle" dominant-baseline="central">payment_terms</text>

<!-- INVOICE -->
<rect x="240" y="300" width="200" height="160" rx="8" stroke-width="0.5" class="coral-fill"/>
<text class="th coral-text" x="340" y="328" text-anchor="middle" dominant-baseline="central">Invoice</text>
<text class="ts coral-text" x="340" y="348" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts coral-text" x="340" y="364" text-anchor="middle" dominant-baseline="central">entity_id FK</text>
<text class="ts coral-text" x="340" y="380" text-anchor="middle" dominant-baseline="central">customer_id FK</text>
<text class="ts coral-text" x="340" y="396" text-anchor="middle" dominant-baseline="central">status, currency</text>
<text class="ts coral-text" x="340" y="412" text-anchor="middle" dominant-baseline="central">total_amount</text>
<text class="ts coral-text" x="340" y="428" text-anchor="middle" dominant-baseline="central">created_by, approved_by</text>

<!-- Customer to Invoice -->
<path d="M200 360 L240 360" stroke="#993C1D" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="212" y="350" dominant-baseline="central">1:N</text>

<!-- GL ACCOUNT -->
<rect x="480" y="300" width="180" height="120" rx="8" stroke-width="0.5" class="teal-fill"/>
<text class="th teal-text" x="570" y="328" text-anchor="middle" dominant-baseline="central">GL account</text>
<text class="ts teal-text" x="570" y="348" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts teal-text" x="570" y="364" text-anchor="middle" dominant-baseline="central">entity_id FK</text>
<text class="ts teal-text" x="570" y="380" text-anchor="middle" dominant-baseline="central">account_code</text>
<text class="ts teal-text" x="570" y="396" text-anchor="middle" dominant-baseline="central">account_name</text>

<!-- Invoice to Payment -->
<path d="M340 460 L340 530" stroke="#993C1D" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="497" dominant-baseline="central">1:N</text>

<!-- Invoice to Journal Entry -->
<path d="M200 420 L200 590 L240 590" stroke="#993C1D" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="205" y="510" dominant-baseline="central">1:N</text>

<!-- PAYMENT -->
<rect x="240" y="530" width="200" height="120" rx="8" stroke-width="0.5" class="amber-fill"/>
<text class="th amber-text" x="340" y="558" text-anchor="middle" dominant-baseline="central">Payment</text>
<text class="ts amber-text" x="340" y="578" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts amber-text" x="340" y="594" text-anchor="middle" dominant-baseline="central">customer_id FK</text>
<text class="ts amber-text" x="340" y="610" text-anchor="middle" dominant-baseline="central">amount, currency</text>
<text class="ts amber-text" x="340" y="626" text-anchor="middle" dominant-baseline="central">payment_reference</text>
<text class="ts amber-text" x="340" y="642" text-anchor="middle" dominant-baseline="central">idempotency_key</text>

<!-- Payment to Journal Entry -->
<path d="M340 650 L340 720" stroke="#BA7517" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="687" dominant-baseline="central">1:N</text>

<!-- GL Account to Journal Entry -->
<path d="M480 360 L570 360 L570 720 L440 720" stroke="#185FA5" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="575" y="540" dominant-baseline="central">1:N</text>

<!-- JOURNAL ENTRY -->
<rect x="240" y="720" width="200" height="140" rx="8" stroke-width="0.5" class="blue-fill"/>
<text class="th blue-text" x="340" y="748" text-anchor="middle" dominant-baseline="central">Journal entry</text>
<text class="ts blue-text" x="340" y="768" text-anchor="middle" dominant-baseline="central">id, tenant_id FK</text>
<text class="ts blue-text" x="340" y="784" text-anchor="middle" dominant-baseline="central">reference_type</text>
<text class="ts blue-text" x="340" y="800" text-anchor="middle" dominant-baseline="central">reference_id</text>
<text class="ts blue-text" x="340" y="816" text-anchor="middle" dominant-baseline="central">document_date, entry_date</text>
<text class="ts blue-text" x="340" y="832" text-anchor="middle" dominant-baseline="central">period_id, adjusts_period_id</text>
<text class="ts blue-text" x="340" y="848" text-anchor="middle" dominant-baseline="central">debit = credit always</text>

<!-- Legend -->
<rect x="20" y="870" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="38" y="878" dominant-baseline="central">Foundation</text>
<rect x="130" y="870" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="148" y="878" dominant-baseline="central">Master data</text>
<rect x="250" y="870" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="268" y="878" dominant-baseline="central">Invoice</text>
<rect x="330" y="870" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="348" y="878" dominant-baseline="central">Payment</text>
<rect x="420" y="870" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="438" y="878" dominant-baseline="central">Accounting</text>

</svg>
