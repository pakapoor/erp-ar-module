services:

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: erp-ar-postgres:16-pgcron
    container_name: erp_db
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: erp_app
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      JWT_JWKS_URL: http://stub:9000/.well-known/jwks.json
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload

  gateway:
    image: envoyproxy/envoy:v1.39.0
    container_name: erp_gateway
    ports:
      - "8000:8000"
    expose:
      - "9901"
    volumes:
      - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      app:
        condition: service_started
      stub:
        condition: service_started

  stub:
    build:
      context: ./delivery_stub
      dockerfile: Dockerfile
    container_name: erp_stub
    ports:
      - "9000:9000"
    command: uvicorn stub:app --host 0.0.0.0 --port 9000 --reload

  delivery_worker:
    build: .
    container_name: erp_delivery_worker
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      DELIVERY_SERVICE_URL: http://stub:9000
      OUTBOX_POLL_INTERVAL_SECONDS: 2
    depends_on:
      db:
        condition: service_healthy
      stub:
        condition: service_started
    volumes:
      - ./src:/app/src
    command: python -m src.delivery_worker
    restart: unless-stopped

  fx_rate_worker:
    build: .
    container_name: erp_fx_rate_worker
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      FX_PROVIDER_URL: https://data-api.ecb.europa.eu/service/data/EXR/D.CAD+CHF+CNY+GBP+INR+JPY+USD.EUR.SP00.A
      FX_SUPPORTED_CURRENCIES: INR,USD,EUR,CNY,GBP,JPY,CHF,CAD
      FX_BASE_CURRENCY: INR
      FX_ENQUEUE_ON_STARTUP: "true"
      FX_POLL_INTERVAL_SECONDS: 10
      FX_MAX_RATE_AGE_DAYS: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: python -m src.fx_rate_worker
    restart: unless-stopped

volumes:
  postgres_data:
