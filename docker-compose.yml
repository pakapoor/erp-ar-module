services:

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: erp-ar-postgres:16-pgcron
    container_name: erp_db
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: erp_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      JWT_JWKS_URL: http://stub:9000/.well-known/jwks.json
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  stub:
    build:
      context: ./delivery_stub
      dockerfile: Dockerfile
    container_name: erp_stub
    ports:
      - "9000:9000"
    command: uvicorn stub:app --host 0.0.0.0 --port 9000 --reload

  delivery_worker:
    build: .
    container_name: erp_delivery_worker
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      DELIVERY_SERVICE_URL: http://stub:9000
      OUTBOX_POLL_INTERVAL_SECONDS: 2
    depends_on:
      db:
        condition: service_healthy
      stub:
        condition: service_started
    volumes:
      - ./src:/app/src
    command: python -m src.delivery_worker
    restart: unless-stopped

volumes:
  postgres_data:
