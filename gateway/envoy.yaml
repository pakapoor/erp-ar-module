admin:
  ignore_global_conn_limit: true
  allow_paths:
    - exact: /ready
    - prefix: /stats
    - prefix: /config_dump
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: public_api_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ar_gateway
                generate_request_id: true
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                  idle_timeout: 300s
                  max_connection_duration: 3600s
                stream_idle_timeout: 30s
                request_timeout: 30s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: >-
                            [gateway] trace=%REQ(X-REQUEST-ID)% method=%REQ(:METHOD)% path=%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% status=%RESPONSE_CODE% jwt=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:dev_jwt:sub)% duration_ms=%DURATION%\n
                route_config:
                  name: ar_routes
                  virtual_hosts:
                    - name: ar_application
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: ar_app
                            timeout: 30s
                          request_headers_to_add:
                            - header:
                                key: x-trace-id
                                value: "%REQ(X-REQUEST-ID)%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        dev_jwt:
                          remote_jwks:
                            http_uri:
                              uri: http://stub:9000/.well-known/jwks.json
                              cluster: jwks_service
                              timeout: 2s
                            cache_duration: 300s
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          forward: true
                          jwt_cache_config:
                            jwt_cache_size: 1000
                      rules:
                        - match:
                            prefix: "/health"
                        - match:
                            prefix: "/docs"
                        - match:
                            prefix: "/openapi.json"
                        - match:
                            prefix: "/redoc"
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: dev_jwt
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: ar_local_rate_limit
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 100
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: ar_local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: ar_local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-local-rate-limit
                            value: "true"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ar_app
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ar_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: app
                      port_value: 8080

    - name: jwks_service
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: jwks_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: stub
                      port_value: 9000

layered_runtime:
  layers:
    - name: static_gateway_limits
      static_layer:
        envoy:
          resource_limits:
            listener:
              public_api_listener:
                connection_limit: 1000
          overload:
            global_downstream_max_connections: 1000
